<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motion tribute to music legends</title>
    <style>
        #stage {
            width: 100%;
            height: 500px;
            position: relative;
            background-image: url('ConcertStage.jpg');
            background-size: 100% 100%;
            background-repeat: no-repeat;
        }

        #dolly {
            width: 130px;
            height: 200px;
            position: absolute;
            top: -500px;
            left: -500px;
        }

        #ozzy {
            width: 130px;
            height: 200px;
            position: absolute;
            top: -500px;
            left: -500px;
        }

    </style>
    <script src="motion.js" defer></script>
</head>

<body>
    <p><button onclick="move()">Move It!</button>&nbsp;
        <button onclick="stopMoving()">Stop!</button></p>
    <div id="container">
        <div id="stage">
        <img id="dolly" src="dollyImages\Dolly4.png" alt="Dolly Parton" />
        <img id="ozzy" src="ozzyImages/Ozzy1.png" alt="Ozzy Osbourne" />
    </div>
    </div>
</body>

</html>
